name: Convert footer logo to modern formats
on:
  push:
    branches:
      - assets/footer-logo-webp-avif-20261030
    paths:
      - .github/workflows/convert-footer-logo.yml
      - public/media/logo-fazenda-rodeo.png

permissions:
  contents: write

jobs:
  convert-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated asset branch
        uses: actions/checkout@v4
      - name: Install image encoders
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Pillow>=11.3.0" pillow-avif-plugin
      - name: Convert original PNG without resizing
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import pillow_avif

          source = Path("public/media/logo-fazenda-rodeo.png")
          image = Image.open(source).convert("RGBA")
          assert image.size == (180, 56), f"Unexpected dimensions: {image.size}"
          assert image.getextrema()[3][0] < 255, "Source has no transparency"

          webp = source.with_suffix(".webp")
          avif = source.with_suffix(".avif")
          image.save(webp, format="WEBP", lossless=True, method=6)
          image.save(avif, format="AVIF", quality=92, speed=4)

          for path in [webp, avif]:
              with Image.open(path) as check:
                  check.load()
                  assert check.size == image.size, f"{path}: dimension mismatch"
                  assert check.mode in ("RGBA", "LA"), f"{path}: alpha channel missing"
              print(f"{path}: {path.stat().st_size:,} bytes")
          print(f"PNG original: {source.stat().st_size:,} bytes")
          PY
      - name: Upload converted assets
        uses: actions/upload-artifact@v4
        with:
          name: fazenda-rodeo-footer-logo-3-formats
          path: |
            public/media/logo-fazenda-rodeo.png
            public/media/logo-fazenda-rodeo.webp
            public/media/logo-fazenda-rodeo.avif
      - name: Commit only the new image formats to the isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/logo-fazenda-rodeo.webp public/media/logo-fazenda-rodeo.avif
          if ! git diff --cached --quiet; then
            git commit -m "assets: generate WebP and AVIF footer logos [skip ci]"
            git push
          fi
