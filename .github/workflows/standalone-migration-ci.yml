name: Validate standalone Cloudflare migration
on:
  push:
    branches: [codex/standalone-cloudflare-migration]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Reconcile dependency lockfile
        run: bun install
      - name: Commit lockfile updated for native Cloudflare dependencies
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "build: synchronize standalone Cloudflare lockfile"
            git push origin HEAD:codex/standalone-cloudflare-migration
          fi
      - name: Unit tests
        run: bun run test
      - name: Verify local media
        run: python3 scripts/check-published-assets.py --local
      - name: Production build without editor-specific tooling
        run: bun run build
      - name: Validate Worker config
        run: |
          test -f wrangler.jsonc
          grep -q '"PODCAST_RSS_KV"' wrangler.jsonc
      - name: Worker preview smoke test (health, RSS alias, media)
        run: |
          bun run preview --host 127.0.0.1 --port 8788 > /tmp/rodeo-preview.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:8788/healthz -o /tmp/rodeo-health.json; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/rodeo-preview.log; exit 1; fi
          grep -q '"status":"ok"' /tmp/rodeo-health.json
          curl --silent --show-error -D /tmp/rss-headers.txt -o /dev/null http://127.0.0.1:8788/rss
          grep -Eq '^HTTP/[0-9.]+ 301' /tmp/rss-headers.txt
          curl --fail --silent --show-error -o /tmp/studio.webp http://127.0.0.1:8788/media/studio-780.webp
          test "$(wc -c < /tmp/studio.webp)" -gt 20000
