name: Verify published Rodeo artwork
on:
  push:
    branches: [codex/standalone-cloudflare-migration]
    paths:
      - 'src/assets/**'
      - 'public/media/**'
      - 'scripts/check-published-assets.py'
      - '.github/workflows/test-published-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify image files and metadata without contacting production
        run: python3 scripts/check-published-assets.py --local
