name: Validate published media on Cloudflare
on:
  push:
    branches: [feat/rss-cloudflare-homologacao]
    paths:
      - 'scripts/check-published-assets.py'
      - 'public/__l5e/**'
      - '.github/workflows/test-published-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every remote image content-type and SHA-256
        run: python3 scripts/check-published-assets.py
