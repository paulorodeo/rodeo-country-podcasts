name: Vendor Lovable media assets
on:
  push:
    branches:
      - feat/rss-cloudflare-homologacao
    paths:
      - 'scripts/vendor-lovable-assets.py'
      - 'src/assets/**'
      - '.github/workflows/vendor-lovable-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vendor-lovable-assets
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download, validate and vendor source images
        run: python3 scripts/vendor-lovable-assets.py
      - name: Commit binary assets to the current feature branch
        shell: bash
        run: |
          git add public/__l5e/assets-v1
          if git diff --cached --quiet; then
            echo 'All Lovable images already versioned'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(images): vendor Lovable source media for independent Cloudflare hosting'
          git push origin HEAD:feat/rss-cloudflare-homologacao
