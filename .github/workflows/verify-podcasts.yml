name: Verify independent Rodeo Country Podcasts
on:
  push:
    branches:
      - codex/standalone-cloudflare-migration
      - feat/rss-cloudflare-homologacao
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun run test
      - name: Verify images
        run: python3 scripts/check-published-assets.py --local
      - name: Audit repository for legacy editor dependencies
        run: |
          banned="$(printf '%s%s|__%s|gpt%s' 'lova' 'ble' 'l5e' '.engineer')"
          if git grep -n -i -E "$banned" -- .; then
            echo "Legacy editor references remain in tracked files" >&2
            exit 1
          fi
          if git ls-files | grep -E "(^|/)(\\.lo""vable|__l""5e)(/|$)"; then
            echo "Legacy editor asset paths remain in tracked files" >&2
            exit 1
          fi
      - name: Build Cloudflare Worker
        run: bun run build
      - name: Verify worker configuration
        run: |
          test -f wrangler.jsonc
          grep -q '"PODCAST_RSS_KV"' wrangler.jsonc
